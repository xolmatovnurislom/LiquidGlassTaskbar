name: Build LiquidGlassTaskbar

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build

      - name: Build Release EXE
        run: cmake --build build --config Release

      - name: Locate built EXE
        id: locate_exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "build" -Filter "*.exe" -Recurse | Select-Object -First 1
          if (-not $exe) {
            Write-Error "EXE file not found in build"
            exit 1
          }
          Write-Output "exe_path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          Write-Output "exe_name=$($exe.Name)" >> $env:GITHUB_OUTPUT

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiquidGlassTaskbar-Windows-x64
          path: ${{ steps.locate_exe.outputs.exe_path }}
          if-no-files-found: error

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.locate_exe.outputs.exe_path }}
