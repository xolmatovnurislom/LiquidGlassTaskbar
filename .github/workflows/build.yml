name: Build LiquidGlassTaskbar

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC & CMake
        uses: ilamovski/msibuild@v1
        with:
          msbuild-path: "C:\\Program Files\\Microsoft Visual Studio\\2022\\Enterprise\\MSBuild\\Current\\Bin\\MSBuild.exe"
        continue-on-error: true

      - name: Configure CMake
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Release EXE
        shell: cmd
        run: |
          cmake --build build --config Release

      - name: Locate built EXE
        id: locate_exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "build\Release" -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) {
            Write-Error "EXE file not found in build\Release"
            exit 1
          }
          Write-Output "exe_path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          Write-Output "exe_name=$($exe.Name)" >> $env:GITHUB_OUTPUT

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiquidGlassTaskbar-Windows-x64
          path: ${{ steps.locate_exe.outputs.exe_path }}
          if-no-files-found: error

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.locate_exe.outputs.exe_path }}
